name: validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate term files
        run: python build/validate.py
      - name: Check source credentials
        run: python build/privacy.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build sqlite
        run: python build/build_sqlite.py dist
      - name: Build authorized full-text knowledge database
        run: python build/build_knowledge.py --out dist
      - name: Build reviewed public r3 snapshot
        run: python build/build_public_r3.py --out dist/public-r3
      - name: Evaluate fixed natural-language retrieval cases
        run: python build/evaluate_public_r3.py dist/public-r3/naikuai-kb-public.sqlite --output dist/retrieval-evaluation.json
      - name: Upload public r3 database and checksums
        uses: actions/upload-artifact@v4
        with:
          name: public-r3-sqlite
          path: dist/public-r3/
          if-no-files-found: error
      - name: Upload retrieval evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: dist/retrieval-evaluation.json
          if-no-files-found: error
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: glossary-sqlite
          path: |
            dist/
            !dist/public-r3/**
          if-no-files-found: error
