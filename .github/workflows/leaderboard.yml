name: leaderboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leaderboard-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate reviewed main data
        run: |
          python build/validate.py
          python build/privacy.py
          python -m unittest discover -s tests -v
      - name: Generate contribution board
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build/leaderboard.py --out dist
      - name: Publish generated branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            const ref = 'heads/leaderboard';
            let parent;
            try {
              parent = (await github.rest.git.getRef({...args, ref})).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = [];
            for (const path of ['leaderboard.svg', 'leaderboard.json', 'leaderboard.md']) {
              const blob = await github.rest.git.createBlob({...args,
                content: fs.readFileSync(`dist/${path}`).toString('base64'), encoding: 'base64'});
              tree.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const nativeReadme = await github.rest.git.createBlob({...args,
              content: fs.readFileSync('dist/leaderboard.md').toString('base64'), encoding: 'base64'});
            tree.push({path: 'README.md', mode: '100644', type: 'blob', sha: nativeReadme.data.sha});
            const license = await github.rest.git.createBlob({...args,
              content: fs.readFileSync('DATA-LICENSE.md').toString('base64'), encoding: 'base64'});
            tree.push({path: 'DATA-LICENSE.md', mode: '100644', type: 'blob', sha: license.data.sha});
            const createdTree = await github.rest.git.createTree({...args, tree});
            const commit = await github.rest.git.createCommit({...args,
              message: 'chore: refresh contribution leaderboard', tree: createdTree.data.sha,
              parents: parent ? [parent] : []});
            if (parent) {
              await github.rest.git.updateRef({...args, ref, sha: commit.data.sha, force: false});
            } else {
              await github.rest.git.createRef({...args, ref: `refs/${ref}`, sha: commit.data.sha});
            }
      - name: Propose native README table updates through PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            const board = JSON.parse(fs.readFileSync('dist/leaderboard.json', 'utf8'));
            const main = (await github.rest.git.getRef({...args, ref: 'heads/main'})).data.object.sha;
            if (main !== board.source_commit) {
              core.info('Main advanced; the next queued run will prepare the current snapshot.');
              return;
            }
            const branch = 'automation/leaderboard-readme';
            const pending = (await github.rest.pulls.list({...args, state: 'open',
              head: `${args.owner}:${branch}`, base: 'main'})).data;
            const response = await github.rest.repos.getContent({...args, path: 'README.md', ref: main});
            const before = Buffer.from(response.data.content, 'base64').toString('utf8');
            const startMarker = '<!-- leaderboard:snapshot:start -->';
            const endMarker = '<!-- leaderboard:snapshot:end -->';
            if (before.split(startMarker).length !== 2 || before.split(endMarker).length !== 2) {
              throw new Error('README requires unique native table markers.');
            }
            const start = before.indexOf(startMarker);
            const end = before.indexOf(endMarker);
            if (end < start) throw new Error('README table markers are out of order.');
            const snapshot = fs.readFileSync('dist/readme.snapshot.md', 'utf8').trimEnd();
            const after = before.slice(0, start) + snapshot + before.slice(end + endMarker.length);
            if (before === after) {
              for (const pull of pending) {
                await github.rest.pulls.update({...args, pull_number: pull.number, state: 'closed'});
              }
              return;
            }
            const base = (await github.rest.git.getCommit({...args, commit_sha: main})).data;
            const blob = await github.rest.git.createBlob({...args,
              content: Buffer.from(after).toString('base64'), encoding: 'base64'});
            const tree = await github.rest.git.createTree({...args, base_tree: base.tree.sha,
              tree: [{path: 'README.md', mode: '100644', type: 'blob', sha: blob.data.sha}]});
            const commit = await github.rest.git.createCommit({...args,
              message: 'docs: sync native contribution table', tree: tree.data.sha, parents: [main]});
            let exists = false;
            try {
              await github.rest.git.getRef({...args, ref: `heads/${branch}`});
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (exists) {
              await github.rest.git.updateRef({...args, ref: `heads/${branch}`, sha: commit.data.sha, force: true});
            } else {
              await github.rest.git.createRef({...args, ref: `refs/heads/${branch}`, sha: commit.data.sha});
            }
            if (!pending.length) {
              await github.rest.pulls.create({...args, head: branch, base: 'main',
                title: 'docs: 同步 README 原生贡献榜',
                body: '根据已合并词条自动更新 README 原生表格。请维护者审查后手动合并；完整榜单已在 leaderboard 分支更新。'});
            }
            // GITHUB_TOKEN-created PRs do not trigger pull_request checks themselves.
            await github.rest.actions.createWorkflowDispatch({...args,
              workflow_id: 'validate.yml', ref: branch});
