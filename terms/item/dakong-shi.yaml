senses:
- context: 装备/道具
  definition: 用于填满装备孔位的垃圾宝石。镶孔流程：打孔石填满、打垫子宝石、再打入有效宝石。
  notes: 打孔石和垫子宝石是宝石镶嵌机制中的必要消耗。
